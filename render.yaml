databases:
  - name: realbiz-db
    databaseName: realbiz_prod
    user: realbiz_user
    plan: free
    region: singapore

services:
  - type: web
    name: realbiz-pro-api
    runtime: docker
    plan: free
    region: singapore
    branch: main
    healthCheckPath: /realbizpro/api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: BACKEND_DOMAIN
        value: https://realbiz-pro-api.onrender.com
      - key: API_PREFIX
        value: api
      - key: CORS_ORIGIN
        value: "true"
      - key: CORS_CREDENTIALS
        value: "true"
      - key: HEALTH_CHECK_ENABLED
        value: "true"
      - key: RATE_LIMIT_MAX
        value: "1000"
      - key: RATE_LIMIT_WINDOW_MS
        value: "900000"

      # JWT
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d

      # Database (Linked automatically from realbiz-db above)
      - key: DATABASE_DIALECT
        value: postgres
      - key: DATABASE_HOST
        fromDatabase:
          name: realbiz-db
          property: host
      - key: DATABASE_PORT
        fromDatabase:
          name: realbiz-db
          property: port
      - key: DATABASE_NAME
        fromDatabase:
          name: realbiz-db
          property: database
      - key: DATABASE_USERNAME
        fromDatabase:
          name: realbiz-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: realbiz-db
          property: password
      - key: DATABASE_MAX_CONNECTIONS
        value: "10"
      - key: DATABASE_IDLE_TIMEOUT
        value: "30000"
      - key: DATABASE_CONNECTION_TIMEOUT
        value: "60000"
      - key: DATABASE_TIMEZONE
        value: UTC
      - key: DATABASE_SYNCHRONIZE
        value: "false"
      - key: DB_SYNC_ALTER
        value: "false"
      - key: DATABASE_LOGGING
        value: "false"
      - key: DATABASE_AUTO_LOAD_MODELS
        value: "true"
      - key: DATABASE_DROP_SCHEMA
        value: "false"

      # Redis (Upstash)
      - key: REDIS_URL
        value: rediss://default:gQAAAAAAAVIuAAIgcDJlMWZiMGQ2N2E2OTk0ZjM1YWQxOGE2NjE0MDI5ZjIyYw@first-skink-86574.upstash.io:6379

      # MinIO / Storage
      - key: MINIO_ENDPOINT
        value: localhost
      - key: MINIO_PORT
        value: "9000"
      - key: MINIO_USE_SSL
        value: "false"
      - key: MINIO_ACCESS_KEY
        value: minioadmin
      - key: MINIO_SECRET_KEY
        value: minioadmin123
      - key: MINIO_DEFAULT_BUCKET
        value: uploads

      # File Upload
      - key: MAX_FILE_SIZE
        value: "52428800"
      - key: COMPRESSION_ENABLED
        value: "true"
      - key: COMPRESSION_QUALITY
        value: "80"
      - key: THUMBNAIL_ENABLED
        value: "true"

      # Email (Mailtrap)
      - key: MAIL_HOST
        value: sandbox.smtp.mailtrap.io
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USER
        value: ee01d9c7f44675
      - key: MAIL_PASSWORD
        value: aa8e037ab08828
      - key: MAIL_DEFAULT_EMAIL
        value: noreply@easysofts.com
      - key: MAIL_DEFAULT_NAME
        value: RealBiz Pro
      - key: MAIL_IGNORE_TLS
        value: "false"
      - key: MAIL_SECURE
        value: "false"
      - key: MAIL_REQUIRE_TLS
        value: "false"

      - key: APP_NAME
        value: RealBiz Pro API
      - key: PERFORMANCE_WARNING_THRESHOLD
        value: "300000000000"
