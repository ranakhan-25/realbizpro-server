services:
  - type: web
    name: realbiz-pro-api
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /realbizpro/api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: BACKEND_DOMAIN
        sync: false
      - key: API_PREFIX
        value: api
      - key: CORS_ORIGIN
        value: "true"
      - key: CORS_CREDENTIALS
        value: "true"
      - key: HEALTH_CHECK_ENABLED
        value: "true"
      - key: RATE_LIMIT_MAX
        value: "1000"
      - key: RATE_LIMIT_WINDOW_MS
        value: "900000"

      # JWT
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 1d

      # Database (PostgreSQL from Render)
      - key: DATABASE_HOST
        sync: false
      - key: DATABASE_PORT
        value: "5432"
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: DATABASE_NAME
        sync: false
      - key: DATABASE_DIALECT
        value: postgres
      - key: DATABASE_MAX_CONNECTIONS
        value: "10"
      - key: DATABASE_IDLE_TIMEOUT
        value: "30000"
      - key: DATABASE_CONNECTION_TIMEOUT
        value: "60000"
      - key: DATABASE_TIMEZONE
        value: UTC
      - key: DATABASE_SYNCHRONIZE
        value: "false"
      - key: DB_SYNC_ALTER
        value: "false"
      - key: DATABASE_LOGGING
        value: "false"
      - key: DATABASE_AUTO_LOAD_MODELS
        value: "true"
      - key: DATABASE_DROP_SCHEMA
        value: "false"

      # Redis (Upstash)
      - key: REDIS_URL
        sync: false

      # MinIO / S3 Compatible
      - key: MINIO_ENDPOINT
        sync: false
      - key: MINIO_PORT
        value: "9000"
      - key: MINIO_USE_SSL
        value: "false"
      - key: MINIO_ACCESS_KEY
        sync: false
      - key: MINIO_SECRET_KEY
        sync: false
      - key: MINIO_DEFAULT_BUCKET
        value: uploads

      # File Upload
      - key: MAX_FILE_SIZE
        value: "52428800"
      - key: COMPRESSION_ENABLED
        value: "true"
      - key: COMPRESSION_QUALITY
        value: "80"
      - key: THUMBNAIL_ENABLED
        value: "true"

      # Email
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USER
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_DEFAULT_EMAIL
        value: noreply@easysofts.com
      - key: MAIL_DEFAULT_NAME
        value: RealBiz Pro
      - key: MAIL_IGNORE_TLS
        value: "false"
      - key: MAIL_SECURE
        value: "false"
      - key: MAIL_REQUIRE_TLS
        value: "false"

      - key: ADMIN_EMAILS
        sync: false
      - key: APP_NAME
        value: RealBiz Pro API
      - key: PERFORMANCE_WARNING_THRESHOLD
        value: "300000000000"
